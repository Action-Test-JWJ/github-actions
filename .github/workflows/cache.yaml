name: ROS 2 Build with Cache
on:
  push:
    paths:
      - 'my-ros2-pkg/**'

jobs:
  ros-build:
    runs-on: ubuntu-latest
    container:
      image: ros:humble # 사용 중인 ROS 2 버전에 맞춰 변경 (foxy, humble, jazzy 등)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Colcon 빌드 결과물 캐싱
      - name: Cache Colcon Build Folders
        uses: actions/cache@v3
        with:
          # 캐싱할 경로: build, install 폴더
          path: |
            build
            install
            log
          # 캐시 키 생성: OS 버전 + 소스코드 변경 여부(hash)
          key: ${{ runner.os }}-ros-build-${{ hashFiles('**/CMakeLists.txt', '**/package.xml') }}
          # 일치하는 키가 없을 때 가장 최근 캐시를 가져오기 위한 접두사
          restore-keys: |
            ${{ runner.os }}-ros-build-

      # 2. 시스템 의존성 설치 (캐시와 별개로 최신 유지 권장)
      - name: Install dependencies via rosdep
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths . --ignore-src -r -y

      # 3. ROS 2 빌드 (colcon)
      - name: Colcon Build
        run: |
          . /opt/ros/humble/setup.sh
          colcon build --symlink-install
